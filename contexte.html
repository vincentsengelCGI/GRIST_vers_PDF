<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Widget Grist de contexte</title>

    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <div id="status_contexte" class="status_contexte">
            Démarrage...
        </div>
    </div>

    <div id="main-view">
        <h3>Widget Contexte</h3>
    </div>

    <!-- Panneau de configuration caché -->
    <div id="config-panel" style="display: none; background: #f5f5f5; padding: 15px;">
        <h3>Configuration du Widget</h3>
        <label>
            Table utilisateur :<br>
            <input type="text" id="table-utilisateur" /><br><br>
            Colonne email table utilisateur :<br>
            <input type="text" id="colonne-email" /><br><br>
            Colonne nom complet table utilisateur :<br>
            <input type="text" id="colonne-nom-complet" /><br><br>
            Colonne contexte table utilisateur :<br>
            <input type="text" id="colonne-contexte" /><br><br>
            Table session :<br>
            <input type="text" id="table-session-utilisateur" /><br><br>
            
        </label>
        <button id="save-btn">Enregistrer</button>
    </div>

</body>
<script src="js/app_contexte.js"></script>

</html>
