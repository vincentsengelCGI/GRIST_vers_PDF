<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Extracteur PDF Grist</title>

    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <div id="main-view">
        <div class="container">
            <h3>Extracteur PDF</h3>
            
            <div id="file-info">
                Initialisation...
            </div>
            
            <button id="btn-extract" disabled>
                Extraire le texte
            </button>
            
            <div id="status" class="status">
                Démarrage...
            </div>
        </div>
    </div>

    <!-- Panneau de configuration caché -->
    <div id="config-panel" style="display: none; background: #f5f5f5; padding: 15px;">
        <h3>Configuration du Widget</h3>
        <label>
            Table utilisateur :<br>
            <input type="text" id="table-utilisateur" /><br><br>
            Colonne email table utilisateur :<br>
            <input type="text" id="colonne-email" /><br><br>
            Colonne nom complet table utilisateur :<br>
            <input type="text" id="colonne-nom-complet" /><br><br>
            Colonne academie table utilisateur :<br>
            <input type="text" id="colonne-academie" /><br><br>
            Table session :<br>
            <input type="text" id="table-session" /><br><br>            
        </label>
        <button id="save-btn">Enregistrer</button>
    </div>

</body>
<script src="js/app.js"></script>
</html>
